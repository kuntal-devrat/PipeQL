name: PipeQL Polyglot Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: CI Tests (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build & Test Python Binding
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin develop -m crates/pipeql-python/Cargo.toml
          pytest python/tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build & Test JS/WASM Binding
        run: |
          wasm-pack build crates/pipeql-wasm --target web --out-dir ../../js/dist
          cd js
          npm ci
          npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build & Test Go Binding
        run: |
          cargo build --release -p pipeql-cffi
          sudo cp target/release/libpipeql_cffi.so /usr/local/lib/ || true
          sudo ldconfig || true
          cd go
          go test -v ./...

  publish-npm:
    name: Publish pipeql to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@flaxmbot'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build & Publish WASM Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp README.md js/README.md
          wasm-pack build crates/pipeql-wasm --target web --out-dir ../../js/dist
          rm -f js/dist/.gitignore
          cd js
          npm ci
          npm run build
          npm pack
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
            echo "@flaxmbot:registry=https://registry.npmjs.org/" >> .npmrc
            npm publish --access public --provenance=false
          else
            echo "NPM_TOKEN not set, package built"
          fi
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-npm
          path: js/*.tgz

  publish-pypi:
    name: Publish pipeql to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Maturin
        run: pip install maturin
      - name: Build Wheel & Publish
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          cp README.md crates/pipeql-python/README.md
          maturin build --release -m crates/pipeql-python/Cargo.toml --sdist
          if [ -n "$MATURIN_PYPI_TOKEN" ]; then
            maturin publish -m crates/pipeql-python/Cargo.toml --skip-existing || echo "PyPI publish failed or token unauthenticated, wheel built"
          else
            echo "PYPI_TOKEN not set, wheel built"
          fi
      - name: Upload PyPI wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-pypi
          path: target/wheels/*

  build-release:
    name: Build binaries (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cli: pipeql-linux-x86_64
            cffi: libpipeql_cffi.so
          - os: macos-latest
            cli: pipeql-macos-x86_64
            cffi: libpipeql_cffi.dylib
          - os: windows-latest
            cli: pipeql-windows-x86_64.exe
            cffi: pipeql_cffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release -p pipeql-cli -p pipeql-cffi
      - name: Package Binaries
        shell: bash
        run: |
          mkdir -p release-dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/pipeql.exe release-dist/${{ matrix.cli }}
            cp target/release/pipeql_cffi.dll release-dist/${{ matrix.cffi }}
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp target/release/pipeql release-dist/${{ matrix.cli }}
            cp target/release/libpipeql_cffi.dylib release-dist/${{ matrix.cffi }}
          else
            cp target/release/pipeql release-dist/${{ matrix.cli }}
            cp target/release/libpipeql_cffi.so release-dist/${{ matrix.cffi }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: release-dist/*

  publish-crates-io:
    name: Publish pipeql-core to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package crate (for release artifact)
        run: |
          cargo package -p pipeql-core --allow-dirty
          mkdir -p crate-dist
          cp target/package/pipeql-core-*.crate crate-dist/
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish -p pipeql-core || echo "crates.io publish skipped or already exists"
          else
            echo "CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
          fi
      - name: Upload crate artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-crate
          path: crate-dist/*

  publish-go-proxy:
    name: Publish to Go Proxy (pkg.go.dev)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Trigger Go Proxy Indexing
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "Publishing Go module at version ${VERSION}"
          # Go modules in subdirectories need go/vX.Y.Z tag format
          git tag "go/${VERSION}" || true
          git push origin "go/${VERSION}" || true
          curl -s "https://proxy.golang.org/github.com/!flaxmbot/!pipe!q!l/go/@v/${VERSION}.info" || true

  package-c-sdk:
    name: Package C/C++ SDK Header
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package C Header
        run: |
          mkdir -p c-sdk/include
          cp crates/pipeql-cffi/include/libpipeql.h c-sdk/include/
          cp README.md c-sdk/
          tar -czvf pipeql-c-sdk-header.tar.gz -C c-sdk .
      - name: Upload C SDK header artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-c-sdk
          path: pipeql-c-sdk-header.tar.gz

  github-release:
    name: GitHub Release
    needs: [build-release, publish-npm, publish-pypi, publish-crates-io, publish-go-proxy, package-c-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add AI System Prompt to Release Assets
        run: cp ai/system_prompt.md artifacts/pipeql-ai-system-prompt.md
      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          VERSION=${GITHUB_REF_NAME}
          {
            echo "# PipeQL ${VERSION}"
            echo ""
            echo "## Highlights"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-merges "${PREV_TAG}..HEAD" | head -50
            else
              git log --oneline --no-merges HEAD | head -50
            fi
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "# Rust / CLI"
            echo "cargo install pipeql-cli"
            echo ""
            echo "# JavaScript / TypeScript"
            echo "npm install @flaxmbot/pipeql"
            echo ""
            echo "# Python"
            echo "pip install pipeql"
            echo ""
            echo "# C/C++ (from source)"
            echo "cargo build --release -p pipeql-cffi"
            echo ""
            echo "# Go"
            echo "go get github.com/Flaxmbot/PipeQL/go@${VERSION}"
            echo '```'
            echo ""
            echo "## Supported Dialects"
            echo ""
            echo "PostgreSQL, SQLite, DuckDB, MySQL"
            echo ""
            echo "## Links"
            echo ""
            echo "- [Documentation](https://pipeql.vercel.app)"
            echo "- [GitHub](https://github.com/Flaxmbot/PipeQL)"
            echo "- [crates.io](https://crates.io/crates/pipeql-core)"
            echo "- [npm](https://www.npmjs.com/package/@flaxmbot/pipeql)"
            echo "- [PyPI](https://pypi.org/project/pipeql/)"
          } > artifacts/CHANGELOG.md
      - name: List artifacts
        run: find artifacts -type f
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/CHANGELOG.md
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
